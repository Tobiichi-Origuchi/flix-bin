name: sync-feishu-release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish Linux
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}

          AUR_PACKAGE_NAME: ${{ vars.AUR_PACKAGE_NAME }}
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/build_and_publish_linux.sh

  sync-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish Windows
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIN_FOLDER_TOKEN: ${{ secrets.FEISHU_WIN_FOLDER_TOKEN }}

          SCOOP_SSH_PRIVATE_KEY: ${{ secrets.SCOOP_SSH_PRIVATE_KEY }}
          SCOOP_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
          SCOOP_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/build_and_publish_windows.sh

  cleanup:
    runs-on: ubuntu-latest
    needs: [sync-linux, sync-windows]
    if: always() && !cancelled()
    steps:
      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch all releases
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,createdAt --order desc -L 100)

          # Identify the latest release for each platform
          latest_linux=$(echo "$releases" | jq -r '[.[] | select(.tagName | test("^v\\d"))][0].tagName // empty')
          latest_windows=$(echo "$releases" | jq -r '[.[] | select(.tagName | test("^windows-v"))][0].tagName // empty')

          echo "Keeping latest Linux release:   ${latest_linux:-<none>}"
          echo "Keeping latest Windows release: ${latest_windows:-<none>}"

          # Delete all releases except the latest of each platform
          echo "$releases" | jq -r '.[].tagName' | while read -r tag; do
            if [[ "$tag" == "$latest_linux" || "$tag" == "$latest_windows" ]]; then
              echo "  ✓ Keeping: $tag"
              continue
            fi
            echo "  ✗ Deleting: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

          echo "Cleanup complete."
